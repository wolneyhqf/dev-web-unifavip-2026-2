<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Ilustração própria do projeto: estante com livros coloridos -->
  <rect x="0" y="0" width="480" height="320" rx="16" fill="#efe6d8"/>
  <!-- Moldura da estante -->
  <rect x="40" y="30" width="400" height="260" rx="6" fill="#8b5a3c"/>
  <rect x="52" y="42" width="376" height="236" fill="#5e3b26"/>
  <!-- Prateleiras -->
  <rect x="52" y="150" width="376" height="10" fill="#8b5a3c"/>
  <rect x="52" y="268" width="376" height="10" fill="#8b5a3c"/>
  <!-- Livros da prateleira de cima -->
  <g>
    <rect x="62"  y="62"  width="26" height="88" fill="#8e2b3a"/>
    <rect x="90"  y="72"  width="22" height="78" fill="#3f78a8"/>
    <rect x="114" y="58"  width="30" height="92" fill="#e0a526"/>
    <rect x="146" y="76"  width="20" height="74" fill="#2f8f7f"/>
    <rect x="168" y="66"  width="28" height="84" fill="#8556b0"/>
    <rect x="198" y="80"  width="18" height="70" fill="#c0505f"/>
    <rect x="218" y="60"  width="26" height="90" fill="#24456b"/>
    <rect x="262" y="70"  width="24" height="80" fill="#b5651d" transform="rotate(-12 274 150)"/>
    <rect x="300" y="64"  width="28" height="86" fill="#4a4038"/>
    <rect x="330" y="74"  width="22" height="76" fill="#2f6f5e"/>
    <rect x="354" y="62"  width="30" height="88" fill="#7a2e1d"/>
    <rect x="386" y="78"  width="32" height="72" fill="#e0a526"/>
  </g>
  <!-- Livros da prateleira de baixo -->
  <g>
    <rect x="62"  y="186" width="32" height="82" fill="#2f8f7f"/>
    <rect x="96"  y="176" width="24" height="92" fill="#7a2e1d"/>
    <rect x="122" y="192" width="20" height="76" fill="#e0a526"/>
    <rect x="144" y="180" width="28" height="88" fill="#3f78a8"/>
    <rect x="174" y="196" width="22" height="72" fill="#8556b0"/>
    <rect x="198" y="184" width="26" height="84" fill="#c0505f"/>
    <rect x="226" y="178" width="20" height="90" fill="#4a4038"/>
    <rect x="248" y="190" width="30" height="78" fill="#24456b"/>
    <!-- Pilha de livros deitados -->
    <rect x="300" y="250" width="110" height="18" fill="#8e2b3a"/>
    <rect x="306" y="232" width="98"  height="18" fill="#2f6f5e"/>
    <rect x="312" y="214" width="88"  height="18" fill="#e0a526"/>
  </g>
</svg>
