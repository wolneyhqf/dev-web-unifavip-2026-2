<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaScript no Console | Biblioteca do Bairro</title>
    <!-- defer: o script executa depois que o HTML foi analisado -->
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Biblioteca do Bairro — JavaScript fundamentos</h1>
    <p>
        Esta página não mostra nada além deste texto: <strong>abra o Console</strong>
        do navegador (F12 → aba Console) para ver o resultado de <code>app.js</code>.
    </p>
    <p>Depois, altere os valores em <code>app.js</code>, salve e atualize a página (F5).</p>
</body>
</html>
